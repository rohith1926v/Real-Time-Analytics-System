services:
  backend:
    container_name: streaming-analytics-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./.env.example
    environment:
      ENVIRONMENT: development
      BACKEND_CORS_ORIGINS: http://localhost:5173,http://localhost:3000
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - streaming-analytics-network

  frontend:
    container_name: streaming-analytics-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    env_file:
      - ./.env.example
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api/v1
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command: npm run dev -- --host 0.0.0.0
    depends_on:
      - backend
    networks:
      - streaming-analytics-network

networks:
  streaming-analytics-network:
    name: streaming-analytics-network
    driver: bridge

volumes:
  frontend_node_modules:
    name: streaming-analytics-frontend-node-modules
